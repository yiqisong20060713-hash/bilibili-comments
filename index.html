<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评论存档</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f6f7f8; --card: #fff; --text: #18191c; --text2: #9499a0;
  --border: #e3e5e7; --blue: #00a1d6;
}
body.dark {
  --bg: #18191c; --card: #242529; --text: #e3e5e7; --text2: #8a8f99;
  --border: #3a3b40;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.6; transition: background 0.3s; }
.container { max-width: 900px; margin: 0 auto; padding: 16px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font-size: 14px; outline: none; }
.toolbar input:focus { border-color: var(--blue); }
.toolbar button { padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; font-size: 14px; white-space: nowrap; }
.toolbar button:hover { border-color: var(--blue); color: var(--blue); }
.toolbar button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.thread { margin-bottom: 12px; }
.comment { background: var(--card); border-radius: 8px; padding: 14px 16px; border: 1px solid var(--border); }
.replies { margin-top: 2px; }
.replies.collapsed { display: none; }
.reply { background: var(--bg); padding: 10px 14px 10px 48px; border-bottom: 1px solid var(--border); }
.reply:last-child { border-bottom: none; border-radius: 0 0 8px 8px; }
.comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.username { font-weight: 600; color: var(--text); }
.meta { color: var(--text2); font-size: 12px; }
.content { word-break: break-word; white-space: pre-wrap; }
.emotes { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.emotes img { width: 24px; height: 24px; vertical-align: middle; }
.pictures { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
.pictures img { max-width: 200px; max-height: 200px; border-radius: 6px; cursor: pointer; object-fit: cover; }
.comment-footer { margin-top: 8px; color: var(--text2); font-size: 12px; display: flex; gap: 16px; align-items: center; }
.reply-toggle { color: var(--blue); cursor: pointer; font-size: 12px; user-select: none; }
.reply-toggle:hover { text-decoration: underline; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
.pagination button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); cursor: pointer; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination span { color: var(--text2); }
.lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; cursor: zoom-out; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 90%; max-height: 90%; border-radius: 4px; }
.error { text-align: center; padding: 40px; color: var(--text2); }
.loading { text-align: center; padding: 40px; color: var(--text2); }
@media (max-width: 600px) {
  .reply { padding-left: 20px; }
  .pictures img { max-width: 140px; max-height: 140px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索评论内容或用户名...">
    <button id="sortTime" class="active">按时间</button>
    <button id="sortLikes">按点赞</button>
    <button id="darkBtn">深色</button>
  </div>
  <div id="commentList"></div>
  <div class="pagination" id="pagination"></div>
</div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script>
var allComments = [];
var mainComments = [];
var replyMap = {};
var filtered = [];
var currentPage = 1;
var pageSize = 20;
var sortMode = "time";

function buildThreads() {
  mainComments = [];
  replyMap = {};
  for (var i = 0; i < allComments.length; i++) {
    var c = allComments[i];
    if (!c.parent || c.parent === "0") {
      mainComments.push(c);
    } else {
      if (!replyMap[c.parent]) replyMap[c.parent] = [];
      replyMap[c.parent].push(c);
    }
  }
  for (var key in replyMap) {
    replyMap[key].sort(function(a, b) { return (a.time || "").localeCompare(b.time || ""); });
  }
}

function renderComment(c, isReply) {
  var div = document.createElement("div");
  div.className = isReply ? "reply" : "comment";

  var header = document.createElement("div");
  header.className = "comment-header";
  var name = document.createElement("span");
  name.className = "username";
  name.textContent = c.name || "匿名用户";
  header.appendChild(name);
  div.appendChild(header);

  var content = document.createElement("div");
  content.className = "content";
  content.innerHTML = c.content || "";
  div.appendChild(content);

  if (c.emotes && c.emotes.length > 0) {
    var emoteDiv = document.createElement("div");
    emoteDiv.className = "emotes";
    for (var i = 0; i < c.emotes.length; i++) {
      var eimg = document.createElement("img");
      eimg.src = c.emotes[i];
      eimg.alt = "表情";
      emoteDiv.appendChild(eimg);
    }
    div.appendChild(emoteDiv);
  }

  if (c.pictures && c.pictures.length > 0) {
    var picDiv = document.createElement("div");
    picDiv.className = "pictures";
    for (var i = 0; i < c.pictures.length; i++) {
      var img = document.createElement("img");
      img.src = c.pictures[i];
      img.alt = "评论图片";
      img.loading = "lazy";
      (function(src) {
        img.addEventListener("click", function() {
          document.getElementById("lightboxImg").src = src;
          document.getElementById("lightbox").classList.add("show");
        });
      })(c.pictures[i]);
      picDiv.appendChild(img);
    }
    div.appendChild(picDiv);
  }

  var footer = document.createElement("div");
  footer.className = "comment-footer";
  var timeSpan = document.createElement("span");
  timeSpan.textContent = c.time || "";
  footer.appendChild(timeSpan);
  var likeSpan = document.createElement("span");
  likeSpan.textContent = "👍 " + (c.likes || "0");
  footer.appendChild(likeSpan);
  div.appendChild(footer);

  return div;
}

function renderList() {
  var list = document.getElementById("commentList");
  list.innerHTML = "";
  var start = (currentPage - 1) * pageSize;
  var end = start + pageSize;
  var pageData = filtered.slice(start, end);
  for (var i = 0; i < pageData.length; i++) {
    var mc = pageData[i];
    var thread = document.createElement("div");
    thread.className = "thread";
    thread.appendChild(renderComment(mc, false));

    var replies = replyMap[mc.id];
    if (replies && replies.length > 0) {
      var toggle = document.createElement("div");
      toggle.className = "reply-toggle";
      toggle.textContent = "共 " + replies.length + " 条回复，点击收起";
      var replyDiv = document.createElement("div");
      replyDiv.className = "replies";
      for (var j = 0; j < replies.length; j++) {
        replyDiv.appendChild(renderComment(replies[j], true));
      }
      toggle.addEventListener("click", function() {
        var rd = this.nextSibling;
        rd.classList.toggle("collapsed");
        this.textContent = rd.classList.contains("collapsed")
          ? "共 " + replies.length + " 条回复，点击展开"
          : "共 " + replies.length + " 条回复，点击收起";
      });
      thread.appendChild(toggle);
      thread.appendChild(replyDiv);
    }
    list.appendChild(thread);
  }
  renderPagination();
}

function renderPagination() {
  var pag = document.getElementById("pagination");
  pag.innerHTML = "";
  var totalPages = Math.ceil(filtered.length / pageSize);
  if (totalPages <= 1) return;
  var prev = document.createElement("button");
  prev.textContent = "上一页";
  prev.disabled = currentPage <= 1;
  prev.addEventListener("click", function() { currentPage--; renderList(); window.scrollTo(0, 0); });
  pag.appendChild(prev);
  var info = document.createElement("span");
  info.textContent = currentPage + " / " + totalPages;
  pag.appendChild(info);
  var next = document.createElement("button");
  next.textContent = "下一页";
  next.disabled = currentPage >= totalPages;
  next.addEventListener("click", function() { currentPage++; renderList(); window.scrollTo(0, 0); });
  pag.appendChild(next);
}

function doSearch() {
  var q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) {
    filtered = mainComments.slice();
  } else {
    filtered = [];
    for (var i = 0; i < mainComments.length; i++) {
      var c = mainComments[i];
      if ((c.content && c.content.toLowerCase().indexOf(q) !== -1) || (c.name && c.name.toLowerCase().indexOf(q) !== -1)) {
        filtered.push(c);
      }
    }
  }
  doSort();
  currentPage = 1;
  renderList();
}

function doSort() {
  if (sortMode === "likes") {
    filtered.sort(function(a, b) { return (parseInt(b.likes) || 0) - (parseInt(a.likes) || 0); });
  } else {
    filtered.sort(function(a, b) { return (b.time || "").localeCompare(a.time || ""); });
  }
}

function loadData() {
  document.getElementById("commentList").innerHTML = '<div class="loading">加载中，请稍候...</div>';
  fetch("comments.json")
    .then(function(res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function(data) {
      allComments = data;
      buildThreads();
      filtered = mainComments.slice();
      doSort();
      renderList();
    })
    .catch(function(err) {
      document.getElementById("commentList").innerHTML = '<div class="error">加载失败：' + err.message + '</div>';
    });
}

document.getElementById("searchInput").addEventListener("input", function() {
  clearTimeout(window._t);
  window._t = setTimeout(doSearch, 300);
});
document.getElementById("sortTime").addEventListener("click", function() {
  sortMode = "time";
  this.classList.add("active");
  document.getElementById("sortLikes").classList.remove("active");
  doSort();
  currentPage = 1;
  renderList();
});
document.getElementById("sortLikes").addEventListener("click", function() {
  sortMode = "likes";
  this.classList.add("active");
  document.getElementById("sortTime").classList.remove("active");
  doSort();
  currentPage = 1;
  renderList();
});
document.getElementById("darkBtn").addEventListener("click", function() {
  document.body.classList.toggle("dark");
  this.textContent = document.body.classList.contains("dark") ? "浅色" : "深色";
});
document.getElementById("lightbox").addEventListener("click", function() {
  this.classList.remove("show");
});

loadData();
</script>
</body>
</html>
